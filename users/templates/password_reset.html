<!DOCTYPE html>
<html>
<head>
    <title>Новий пароль</title>
</head>

<body>


<h1>Відновлення пароля</h1>


<form method="post">

    {% csrf_token %}


    <label>
        Новий пароль:
    </label>

    <input 
        type="password"
        name="password"
    >


    <br><br>


    <label>
        Повторіть пароль:
    </label>

    <input 
        type="password"
        name="password_confirm"
    >


    <br><br>


    <button type="submit">
        Змінити пароль
    </button>

</form>


</body>
</html>
