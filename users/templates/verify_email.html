<!DOCTYPE html>
<html>

<head>
    <title>Підтвердження email</title>
</head>


<body>


<h1>
    Підтвердження електронної пошти
</h1>


{% if verified %}

    <p>
        Ваш email успішно підтверджено!
    </p>


    <a href="/">
        Перейти до сайту
    </a>


{% else %}

    <p>
        Не вдалося підтвердити email.
    </p>


{% endif %}



</body>

</html>
