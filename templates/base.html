<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BudgetBox{% endblock %}</title>
</head>
<body>

    <nav>
        <a href="{% url 'dashboard:user' %}">Головна</a>
        <a href="{% url 'users:user' %}">Профіль</a>
        <a href="{% url 'budgets:budget_page' %}">Бюджети</a>
        <a href="{% url 'transaction:list' %}">Транзакції</a>
        <a href="{% url 'banking:banking' %}">Банк</a>
        {% if request.user.is_authenticated %}
            <a href="{% url 'users:logout' %}">Вийти</a>
        {% else %}
            <a href="{% url 'users:login' %}">Увійти</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
