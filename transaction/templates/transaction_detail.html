{% extends "base.html" %}
{% block content %}
<h1>Transaction details</h1>

<h3>{{transaction.amount}}</h3>
<p>{{transaction.category}}</p>
<p>{{transaction.date}}</p>

<p>Залишилось для цієї категорії: {{remaining}}</p>

<a href="{% url 'transactions:list' %}">Back to all transactions</a>
{% endblock %}
