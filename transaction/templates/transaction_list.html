{% extends "base.html" %}
{% block content %}

<h1>All transactions</h1>

<ul>
    {% for transaction in transactions %}
    <li>
        <a href="{% url 'transactions:detail' tr_id=transaction.id %}">
            {{ transaction.amount }}UAH
            {{ transaction.category }}
            {{ transaction.description|truncatewords:5 }}
        </a>
    </li>
    {% endfor %}
</ul>

{% endblock %}
