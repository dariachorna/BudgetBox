{% extends "base.html" %}
{% block content %}
    <h1>Banking account</h1>

    {% if connection %}
    <p>{{connection.account_id}}</p>
    <p>{{connection.created_at|date:"d.m.Y H:i"}}</p>
    <a href="{% url 'banking:disconnection' %}"> Disconnect banking account</a>
    {% else %}
    <p>Banking account isn't connected</p>
    <a href="{% url 'banking:synk' %}">Connect banking account</a>
    {% endif %}

{% endblock %}
